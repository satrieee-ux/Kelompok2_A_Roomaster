name: roomaster
description: Roomaster - peminjaman ruangan dan pelaporan kerusakan fasilitas ITS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  supabase_flutter: ^2.5.0
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.0
  intl: '>=0.19.0 <0.21.0'
  image_picker: ^1.1.0
  file_picker: ^8.0.0
  mobile_scanner: ^5.2.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.0
  mime: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/rooms/
    - assets/images/bg/
